services:
  - type: static
    name: rentease9ja
    env: static
    # Astro now builds the site; static output is published from ./dist
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # 1. Handle the homepage (rentease9ja.com)
      - source: /
        destination: /index.html

      # 2. Pretty URLs: Rewrite any extensionless path (like /buy) to its .html file (/buy.html)
      - source: ^/(?!(?:.*?\..*))(.+)
        destination: /$1.html

      # 3. Redirect actual .html URLs back to the pretty version
      - source: /(.*)\.html
        destination: /$1
        type: redirect
